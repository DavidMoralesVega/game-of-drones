<header class="mx-auto flex w-full max-w-5xl items-center justify-between px-4 py-6">
  <a routerLink="/" class="text-xl font-black tracking-tight">
    <span class="text-accent">Game</span> of Drones
  </a>
  @if (!store.hasGameInProgress()) {
    <a routerLink="/rules" class="text-sm text-muted hover:text-accent">Rules</a>
  }
</header>

<main class="mx-auto w-full max-w-5xl px-4 pb-12">
  <router-outlet />
</main>

<footer class="mx-auto w-full max-w-5xl px-4 pb-6 text-center text-xs text-muted/70">
  Game of Drones · David Morales Vega
</footer>
